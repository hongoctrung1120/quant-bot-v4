    "ETH/USDT": 0.04
    "SOL/USDT": 0.08
    "XRP/USDT": 0.06

  asset_weights:
    "BTC/USDT": 40.0
    "ETH/USDT": 25.0
    "SOL/USDT": 10.0
    "XRP/USDT": 5.0

  strategy_weights:
    trend_following: 40.0
    momentum: 20.0
    mean_reversion: 20.0
    breakout: 10.0

  regime_adjustments:
    TREND_BULL:
      trend_following: 1.2
      momentum: 1.2
      mean_reversion: 0.7
    TREND_BEAR:
      trend_following: 1.2
      momentum: 1.1
      mean_reversion: 0.8
    MEAN_REVERTING:
      mean_reversion: 1.5
      trend_following: 0.6
    HIGH_VOLATILITY:
      all: 0.7
